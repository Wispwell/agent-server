[project]
name = "agent-server"
version = "0.0.0"
description = "A contained multi-agent system: an untrusted planner, sandboxed executors, and a deterministic containment boundary between them."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50",   # Ed25519
    "pyyaml>=6.0",        # role catalog / policy config
    "mcp>=2.1",           # tool gateway
    "openai>=3.8",        # governor (M3) — OpenAI-compatible client against OpenRouter
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.16"]

[project.scripts]
agent-server = "agentserver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentserver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
