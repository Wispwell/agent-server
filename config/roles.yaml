# Role catalog — capability sets frozen at config time.
#
# The governor SELECTS a role and supplies parameters. It can never define a
# capability set. Requested capabilities must satisfy:
#     requested subset-of role.capabilities subset-of governor.ceiling
#
# Open question: granularity. Start with three and let friction teach the shape.

